name: Deploy Angular App to FTP

on:
  push:
    branches:
      - tmp

env:
  APP_NAME: orthodox-web
  FTP_SERVER: win9081.site4now.net
  FTP_USERNAME: admin-huss

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Angular CLI
        run: npm install -g @angular/cli

      - name: Install dependencies
        run: npm install

      - name: Build Angular project
        run: ng build --configuration=production

      - name: Copy Web.config
        run: cp web.config dist/${{ env.APP_NAME }}/browser/web.config

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Clear FTP directory except /api
        env:
          FTP_SERVER: ${{ env.FTP_SERVER }}
          FTP_USERNAME: ${{ env.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          export LFTP_PASSWORD="$FTP_PASSWORD"

          entries="$(lftp -e "set cmd:fail-exit yes; cd /ortodox; cls -1; quit" \
            "ftp://$FTP_USERNAME@$FTP_SERVER")"

          script="$(mktemp)"
          {
            echo "set cmd:fail-exit yes"
            echo "open ftp://$FTP_USERNAME@$FTP_SERVER"
            echo "cd /ortodox"
            while IFS= read -r line; do
              name="${line%/}"
              [ -z "$name" ] && continue
              [ "$name" = "api" ] && continue
              printf 'rm -rf "%s"\n' "$name"
            done <<< "$entries"
            echo "quit"
          } > "$script"
          cat "$script"
          lftp -f "$script"

      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@4.3.4
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ env.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: dist/${{ env.APP_NAME }}/browser/
          server-dir: /ortodox/
